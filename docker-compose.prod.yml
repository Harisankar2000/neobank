# Production stack for Coolify (or any Docker host): frontend, API, worker, Postgres, Redis, Kafka.
# Only the `web` service is exposed; give it your domain in Coolify. Everything else stays private.
#
# Required environment variables (set them in Coolify → Environment Variables):
#   POSTGRES_PASSWORD   long random string
#   JWT_SECRET          at least 32 random characters
#   ADMIN_API_KEY       at least 24 random characters (the admin console login)
# Generate each with: openssl rand -hex 32

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgresql://neobank:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/neobank
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: bank.events
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
  TRUST_PROXY: 'true'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose: ['80']
    depends_on:
      api: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    expose: ['3100']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3100/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    environment: *api-env
    depends_on:
      api: { condition: service_healthy } # the API runs the migrations first
      kafka: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neobank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: neobank
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neobank']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep Kafka small enough for a 4 GB server.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15

volumes:
  postgres-data:
  redis-data:
  kafka-data:
