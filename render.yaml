# Render Blueprint for the NeoBank API (free plan).
# Render → New → Blueprint → pick this repository. It asks for the values marked `sync: false`.
#
# Postgres and Redis come from free external services (Render's free Postgres expires after 30 days):
#   DATABASE_URL           Neon pooled connection string (host with "-pooler"), for app traffic
#   DATABASE_URL_UNPOOLED  Neon direct connection string, used only by migrations
#   REDIS_URL     Upstash: the rediss://… URL (TLS)
# Kafka is optional: EVENT_TRANSPORT=direct delivers events in-process. To use Aiven Kafka instead,
# set EVENT_TRANSPORT=kafka plus the KAFKA_* variables described in the README.

services:
  - type: web
    name: neobank-api
    runtime: docker
    plan: free
    # Same AWS region as Neon (aws-us-east-1) and Upstash (us-east-1); Render's default is Oregon.
    region: virginia
    branch: staging
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      # Render's free plan has no background workers, so the API runs the outbox relay itself.
      - key: RUN_WORKER_IN_API
        value: 'true'
      - key: EVENT_TRANSPORT
        value: direct
      - key: DATABASE_URL
        sync: false
      # Neon's direct (non-pooled) string; migrations need a real session for their advisory lock.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
