server {
  listen 80;
  root /usr/share/nginx/html;

  # The browser only talks to this server; /api and /docs are forwarded to the API
  # container, so there is one domain and no CORS to configure.
  location /api/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:3100;
  }

  # Built files have a hash in their name, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: any other path (e.g. /transactions, /admin) loads index.html.
  location / {
    try_files $uri /index.html;
  }
}
